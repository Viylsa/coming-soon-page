<body>
  <!--
    This page is a React entry (src/about.jsx), not hand-written markup. It
    mounts the same Nav, footer and design tokens the homepage uses, which is
    the only reliable way to stop the two pages drifting apart visually.
    scripts/prerender.mjs snapshots the rendered HTML into dist/about.html at
    build time, so crawlers and no-JS visitors get the full page.
  -->
  <div id="root"></div>
  <script type="module" src="/src/about.jsx"></script>

  <!--
    Person entities carry the founders as real, linkable identities rather than
    bare name strings — the entity signal a new domain needs, and the same
    sameAs play already used for the Organization. When each founder supplies a
    LinkedIn (and GitHub where relevant), add it to that Person's "sameAs" here
    AND to the matching entry in src/pages/About.jsx so the page and the markup
    never disagree.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "AboutPage",
        "@id": "https://www.viylsa.app/about.html#webpage",

        "name": "About VIYLSA",
        "isPartOf": { "@id": "https://www.viylsa.app/#website" },
        "about": { "@id": "https://www.viylsa.app/#org" },
        "inLanguage": "en-PK"
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.viylsa.app/" },
          { "@type": "ListItem", "position": 2, "name": "About", "item": "https://www.viylsa.app/about.html" }
        ]
      },
      {
        "@type": ["Organization", "LocalBusiness"],
        "@id": "https://www.viylsa.app/#org",
        "name": "VIYLSA",
        "url": "https://www.viylsa.app/",
        "logo": "https://www.viylsa.app/assets/viylsa-mark-sm.png",
        "sameAs": [
          "https://www.facebook.com/profile.php?id=61571004368984",
          "https://www.linkedin.com/company/viylsa-tours/",
          "https://www.instagram.com/viylsa_virtualtours"
        ],
        "email": "viylsavirtualtour@gmail.com",
        "telephone": "+92-310-5968568",
        "address": { "@type": "PostalAddress", "addressLocality": "Islamabad", "addressCountry": "PK" },
        "founder": [
          { "@id": "https://www.viylsa.app/about.html#aleena-tahir" },
          { "@id": "https://www.viylsa.app/about.html#saqlain-abbas" },
          { "@id": "https://www.viylsa.app/about.html#aena-habib" }
        ]
      },

      {
        "@type": "Person",
        "@id": "https://www.viylsa.app/about.html#aleena-tahir",
        "name": "Aleena Tahir",
        "jobTitle": "Co-Founder & CEO",
        "worksFor": { "@id": "https://www.viylsa.app/#org" },
        "mainEntityOfPage": { "@id": "https://www.viylsa.app/about.html#webpage" }
      },
      {
        "@type": "Person",
        "@id": "https://www.viylsa.app/about.html#saqlain-abbas",
        "name": "Saqlain Abbas",
        "jobTitle": "Co-Founder & CTO",
        "worksFor": { "@id": "https://www.viylsa.app/#org" },
        "mainEntityOfPage": { "@id": "https://www.viylsa.app/about.html#webpage" },
        "sameAs": [
          "https://github.com/Razee4315"
